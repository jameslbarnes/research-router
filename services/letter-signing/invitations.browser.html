<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitation browser checks</title><link rel="stylesheet" href="/letter/sign.css">
<style>body{max-width:800px;margin:40px auto;padding:0 24px;background:#fbfaf7;font:16px/1.6 Arial;color:#17271f}.pass{color:#254839}.fail{color:#9b3928}#fixture{margin-top:40px;border-top:1px solid;padding-top:24px}</style>
<h1>Invitation browser checks</h1><p>Local fixtures. Sharing and clipboard calls are stubbed; no messages leave this page.</p>
<p id="summary" role="status">Running…</p><ol id="results"></ol><section id="fixture" data-signing><div class="sign-share"></div></section>
<script src="/letter/invitations.js"></script><script>
(async () => {
  const results = document.querySelector('#results'), summary = document.querySelector('#summary'); let passed = 0, failed = 0;
  // Fixture I/O resolves in microtasks. Avoid Safari background-tab timer throttling.
  const flush = async () => { for (let i = 0; i < 40; i++) await Promise.resolve(); };
  const check = (condition, message) => { if (!condition) throw new Error(message); };
  async function test(name, run) { try { await run(); passed++; const li = document.createElement('li'); li.className='pass'; li.textContent='PASS · '+name; results.append(li); }
    catch (error) { failed++; const li=document.createElement('li'); li.className='fail'; li.textContent='FAIL · '+name+' · '+error.message;results.append(li); } }
  let events, panel, share, copy, lookup, releaseCitations, releasePreparation;
  const letter = { title: 'Bargaining For Our Minds', url: 'https://letter.example/' };
  const candidate = { id: 'candidate-1', name: 'Maya Chen', orcid: '0000-0001-5109-3700', affiliation: 'Example Institute', citations: { count: 1250, url: 'https://openalex.org/A100' }, papers: [{ title: 'A shared paper', url: 'https://doi.org/10.1234/example' }] };
  async function mount({ unavailableShare = false, preparationFailure = false, holdPreparation = false, holdCitations = false, warm = false, lookupFailure = false, citationFailure = false, names } = {}) {
    lookup?.cancel(); events=[];
    const citationGate = holdCitations ? new Promise(resolve => { releaseCitations = resolve; }) : Promise.resolve();
    const preparationGate = holdPreparation ? new Promise(resolve => { releasePreparation = resolve; }) : Promise.resolve();
    share = async data => { events.push({ type:'share', data }); };
    copy = async text => { events.push({ type:'copy', text }); };
    Object.defineProperty(navigator, 'share', { configurable: true, value: unavailableShare ? undefined : data => share(data) });
    Object.defineProperty(navigator, 'clipboard', { configurable:true, value:{ writeText:text=>copy(text) } });
    document.querySelector('#fixture').innerHTML='<div class="sign-share"></div>'; panel=document.querySelector('.sign-share');
    const network = { candidates:names ? names.map((name,i)=>({...candidate,id:'name-'+i,name})) : [candidate, {...candidate,id:'candidate-2',name:'Alex Morgan',orcid:'',citations:null}], scannedWorks:1,status:'retrieved',revision:'fixture',citationLookup:{status:'retrieved',matchedCandidates:1} };
    const request = async (path, options={}) => {
      const data=JSON.parse(options.body || '{}'); events.push({ type:'request', path, data, method:options.method });
      if (path==='invitations/action') return {ok:true};
      if (path==='coauthors') {
        if (lookupFailure) throw new Error('Fixture lookup failure');
        return {...network,candidates:[...network.candidates].reverse(),citationLookup:{status:'pending',matchedCandidates:0}};
      }
      if (path==='coauthors/citations') { await citationGate; if(citationFailure) throw new Error('Fixture citation failure'); return network; }
      if (path==='invitations') {
        await preparationGate; if(preparationFailure) throw new Error('Fixture preparation failure');
        return {invitation:{id:'general',name:'',url:letter.url+'?via=general',papers:[]}};
      }
      throw new Error('Unexpected fixture request '+path);
    };
    lookup = window.LetterInvitations.createLookup(request);
    if (warm) { lookup.start(); await flush(); check(!events.some(e=>e.path==='invitations'),'prefetch prepared an invitation before signing'); }
    window.LetterInvitations.mount(panel,{letter, request, lookup}); await flush();
  }
  await test('Sharing works immediately while the coauthor and referral lookups are pending', async () => {
    await mount({holdCitations:true,holdPreparation:true});
    check(panel.querySelector('.invite-prompt').textContent==='Would you invite a collaborator to read the letter?','generic prompt missing');
    check(!panel.querySelector('.invite-native').disabled&&!panel.querySelector('.invite-copy').disabled,'actions blocked on loading');
    check(!events.some(e=>e.type==='share'||e.type==='copy'),'shared without a click');
    check(panel.querySelectorAll('button').length===2 && !panel.querySelector('input,form,details,textarea'),'extra setup controls remain');
    events=[];
    let finishShare;
    share=data=>{events.push({type:'share',data});return new Promise(resolve=>{finishShare=resolve;});};
    panel.querySelector('.invite-native').click();
    check(events[0].type==='share' && events[0].data.url===letter.url,'immediate share missing canonical URL');
    releasePreparation(); releaseCitations(); await flush(); finishShare(); await flush();
    check(!events.some(e=>e.path==='invitations/action'),'canonical URL incorrectly attributed to the late referral link');
    check(panel.querySelector('.invite-prompt').textContent.includes('a collaborator'),'prompt changed after interaction');
  });
  await test('Ranked coauthors appear in the prompt and stay out of the outgoing message', async () => {
    await mount();
    check(panel.querySelector('.invite-prompt').textContent==='Would you invite Maya Chen or Alex Morgan to read the letter?','ranked names missing');
    events=[]; panel.querySelector('.invite-native').click(); await flush();
    check(events[0].type==='share','network bookkeeping preceded native sharing');
    check(events[0].data.text==='I’ve signed this letter asking AI labs to negotiate collectively with researchers. Would you take a look and consider joining me?','message changed or coauthor names leaked into it');
    check(events[0].data.url===letter.url+'?via=general','prepared referral link missing');
    check(events.some(e=>e.path==='invitations/action'&&e.data.action==='share_menu'),'handoff not recorded');
    check(!/sent|delivered/i.test(panel.querySelector('[data-invite-status]').textContent),'claimed delivery');
  });
  await test('Names are limited to two, deduplicated, and rendered as text', async () => {
    await mount({names:['  Maya Chen  ','maya chen','<img src=x>','Fourth Person']});
    check(panel.querySelector('.invite-prompt').textContent==='Would you invite Maya Chen, <img src=x>, or any of the 4 coauthors we found to read the letter?','name limit, deduplication or coauthor count failed');
    check(!panel.querySelector('img'),'coauthor name interpreted as HTML');
    await mount({names:['Maya Chen']});
    check(panel.querySelector('.invite-prompt').textContent==='Would you invite Maya Chen to read the letter?','single coauthor grammar incorrect');
    await mount({names:[]});
    check(panel.querySelector('.invite-prompt').textContent.includes('a collaborator'),'empty results lost the generic prompt');
  });
  await test('Repeated sharing and copying reuse one general invitation', async () => {
    await mount();
    panel.querySelector('.invite-native').click(); await flush();
    panel.querySelector('.invite-copy').click(); await flush();
    const preparations=events.filter(e=>e.path==='invitations');
    check(preparations.length===1 && preparations[0].method==='POST' && Object.keys(preparations[0].data).length===0,'extra recipient-specific preparation or history lookup');
    check(events.find(e=>e.type==='copy').text.endsWith('\n\n'+letter.url+'?via=general'),'copy lost referral URL');
    check(events.some(e=>e.path==='invitations/action'&&e.data.action==='copied'),'copy not recorded');
  });
  await test('Cancelling native sharing records no action and leaves both controls usable', async () => {
    await mount(); events=[]; share=async()=>{throw new DOMException('Cancelled','AbortError');};
    panel.querySelector('.invite-native').click(); await flush();
    check(!events.some(e=>e.path==='invitations/action'),'cancellation recorded as sharing');
    check(!panel.querySelector('[data-invite-status]').classList.contains('error'),'cancellation shown as error');
    check(!panel.querySelector('.invite-native').disabled&&!panel.querySelector('.invite-copy').disabled,'controls stuck');
  });
  await test('Blocked sharing offers a working copy action', async () => {
    share=async()=>{throw new DOMException('Blocked','NotAllowedError');};
    panel.querySelector('.invite-native').click(); await flush();
    check(panel.querySelector('[data-invite-status]').textContent.includes('Copy the invitation'),'fallback missing');
    panel.querySelector('.invite-copy').click(); await flush();
    check(events.some(e=>e.type==='copy'),'copy unavailable after share failure');
  });
  await test('Blocked clipboard leaves the complete invitation selected for manual copying', async () => {
    events=[]; copy=async()=>{throw new DOMException('Blocked','NotAllowedError');};
    panel.querySelector('.invite-copy').click(); await flush();
    const fallback=panel.querySelector('.invite-copy-fallback');
    check(fallback.value.startsWith('I’ve signed this letter')&&fallback.value.endsWith(letter.url+'?via=general'),'incomplete fallback');
    check(fallback.readOnly&&document.activeElement===fallback&&fallback.selectionEnd===fallback.value.length,'fallback not selectable');
    check(!events.some(e=>e.path==='invitations/action'),'failed copy recorded');
    copy=async text=>events.push({type:'copy',text}); panel.querySelector('.invite-copy').click(); await flush();
    check(!panel.querySelector('.invite-copy-fallback'),'stale fallback remains after successful copy');
  });
  await test('Browsers without native sharing retain copy controls', async () => {
    await mount({unavailableShare:true}); check(panel.querySelector('.invite-native').hidden,'unsupported button visible');
    panel.querySelector('.invite-copy').click(); await flush();
    check(events.some(e=>e.type==='copy'&&e.text.includes('via=general')),'copy unavailable');
  });
  await test('Referral failure still allows sharing the canonical letter URL', async () => {
    await mount({preparationFailure:true}); events=[];
    panel.querySelector('.invite-copy').click(); await flush();
    panel.querySelector('.invite-native').click(); await flush();
    check(events.find(e=>e.type==='copy').text.endsWith(letter.url),'canonical copy unavailable');
    check(events.find(e=>e.type==='share').data.url===letter.url,'canonical share unavailable');
    check(!events.some(e=>e.path==='invitations/action'),'untracked URL attributed');
    check(panel.querySelector('.invite-privacy').hidden,'promised attribution for an untracked link');
  });
  await test('A lookup warmed during form review is reused after signing', async () => {
    await mount({warm:true});
    check(events.filter(e=>e.path==='coauthors').length===1,'lookup repeated at signing');
    check(events.filter(e=>e.path==='coauthors/citations').length===1,'citations repeated at signing');
    check(panel.querySelector('.invite-prompt').textContent.includes('Maya Chen or Alex Morgan'),'warm names missing');
  });
  await test('Names appear in citation-ranked order when the lookup settles', async () => {
    await mount({holdCitations:true,warm:true});
    check(panel.querySelector('.invite-prompt').textContent.includes('a collaborator'),'provisional order flashed');
    releaseCitations(); await flush();
    check(panel.querySelector('.invite-prompt').textContent.includes('Maya Chen or Alex Morgan'),'final ranking ignored');
    check(events.filter(e=>e.path==='coauthors').length===1,'in-flight lookup duplicated');
  });
  await test('Coauthor and citation failures leave sharing usable', async () => {
    await mount({lookupFailure:true});
    check(panel.querySelector('.invite-prompt').textContent.includes('a collaborator'),'generic invitation lost');
    panel.querySelector('.invite-copy').click(); await flush();
    check(events.some(e=>e.type==='copy'),'lookup failure blocked copying');
    await mount({citationFailure:true});
    check(panel.querySelector('.invite-prompt').textContent.includes('Alex Morgan or Maya Chen'),'available coauthors lost on citation failure');
  });
  await test('Cancelled lookup results cannot reach another account', async () => {
    await mount({holdCitations:true});
    const prompt=panel.querySelector('.invite-prompt').textContent;
    lookup.cancel(); releaseCitations(); await flush();
    check(panel.querySelector('.invite-prompt').textContent===prompt,'cancelled result updated old account');
  });
  await test('The real signing form starts discovery on connection and carries it through submission', async () => {
    lookup.cancel();
    const originalFetch=window.fetch, calls=[];
    let releasePapers, releaseCounts;
    const papersReady=new Promise(resolve=>{releasePapers=resolve;});
    const countsReady=new Promise(resolve=>{releaseCounts=resolve;});
    const network={candidates:[{...candidate,citations:null}],scannedWorks:1,status:'retrieved',revision:'sign-flow',citationLookup:{status:'pending',matchedCandidates:0}};
    const letter={title:'Bargaining For Our Minds',hash:'fixture-hash',paragraphs:[],url:'https://letter.example/'};
    document.body.classList.add('signing-companion');
    const root=document.querySelector('#fixture'); root.innerHTML='';
    window.fetch=async (url,options={})=>{
      const path=new URL(url,location.href).pathname.split('/api/')[1]; calls.push(path);
      if(path==='session') return Response.json({configured:true,environment:'sandbox',letter,csrf:'fixture-csrf',signature:null,
        user:{name:'Fixture Researcher',orcid:'0000-0002-1825-0097',url:'https://sandbox.orcid.org/0000-0002-1825-0097'}});
      if(path==='profile') return Response.json({status:'retrieved',name:'Fixture Researcher',suggestedAffiliation:'Example Lab',affiliations:[],keywords:[],works:[]});
      if(path==='coauthors') { await papersReady; return Response.json(network); }
      if(path==='coauthors/citations') { await countsReady; return Response.json({...network,candidates:[candidate],citationLookup:{status:'retrieved',matchedCandidates:1}}); }
      if(path==='signatures') return Response.json({signature:{name:'Fixture Researcher',affiliation:'Example Lab',status:'approved'}});
      if(path==='invitations'&&!options.method) return Response.json({invitations:[],network:null});
      if(path==='invitations') return Response.json({invitation:{id:'general',name:'',url:'https://letter.example/?via=general',papers:[]}});
      throw new Error('Unexpected fixture request '+path);
    };
    try {
      await new Promise((resolve,reject)=>{ const script=document.createElement('script'); script.src='/letter/sign.js'; script.onload=resolve; script.onerror=reject; document.body.append(script); });
      await flush();
      check(calls.filter(p=>p==='coauthors').length===1,'connection did not start discovery');
      check(!calls.includes('signatures')&&!calls.includes('invitations'),'connection signed or prepared an invitation');
      const form=root.querySelector('form'); check(Boolean(form),'slow lookup blocked the signing form');
      form.elements.consent.checked=true;
      form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); await flush();
      check(root.querySelector('.sign-result-note').textContent==='Thank you for signing the letter.','signature was blocked on discovery');
      check(root.querySelector('h2').textContent==='Test signature saved.','sandbox signature claimed to be public');
      check(!root.querySelector('.invite-copy').disabled,'general invitation blocked on discovery');
      releasePapers(); await flush();
      check(root.querySelector('.invite-prompt').textContent.includes('a collaborator'),'partial lookup removed generic prompt');
      releaseCounts(); await flush();
      check(root.querySelector('.invite-prompt').textContent==='Would you invite Maya Chen to read the letter?','late ranked coauthor missing');
      check(calls.filter(p=>p==='coauthors').length===1,'signing restarted discovery');
    } finally { releasePapers(); releaseCounts(); await flush(); window.fetch=originalFetch; document.body.classList.remove('signing-companion'); }
  });
  await test('Automatic approval refreshes the public list; held signatures show a private review result', async () => {
    const frame=document.createElement('iframe'); frame.title='Automatic screening checks'; document.body.append(frame);
    try {
      for (const outcome of ['approved','pending_review']) {
        await new Promise(resolve=>{ frame.onload=resolve; frame.srcdoc='<body class="signing-companion"><section data-signing></section><section data-signatories><span data-signatory-count>0 signatures</span><div data-signatory-list></div></section></body>'; });
        let signed=false, publicReads=0;
        const signer={name:'Fixture Researcher',affiliation:'Example Lab',orcid:'0000-0002-1825-0097',citations:null};
        frame.contentWindow.fetch=async (url,options={})=>{
          const target=new URL(url,location.href), path=target.pathname.split('/api/')[1];
          if(target.pathname.endsWith('signatories.json')) return Response.json([]);
          if(path==='session') return Response.json({configured:true,environment:'production',csrf:'fixture-csrf',signature:null,
            user:{...signer,url:'https://orcid.org/'+signer.orcid},letter:{title:'Fixture letter',hash:'fixture',paragraphs:[]}});
          if(path==='profile') return Response.json({status:'unavailable'});
          if(path==='signatures'&&options.method==='POST') { signed=true; return Response.json({signature:{...signer,status:outcome}}); }
          if(path==='signatures') { publicReads++; return Response.json(signed&&outcome==='approved'?[signer]:[]); }
          throw new Error('Unexpected screening fixture request '+path);
        };
        await new Promise((resolve,reject)=>{ const script=frame.contentDocument.createElement('script'); script.src='/letter/sign.js'; script.onload=resolve; script.onerror=reject; frame.contentDocument.body.append(script); });
        await flush();
        const doc=frame.contentDocument, form=doc.querySelector('form'); check(Boolean(form),'signing form missing');
        form.elements.consent.checked=true;
        form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); await flush();
        check(doc.querySelector('h2').textContent===(outcome==='approved'?'Your name has been added.':'Your signature is awaiting review.'),'wrong screening result');
        if(outcome==='approved') {
          check(publicReads===2,'public list did not refresh after automatic approval');
          check(doc.querySelector('[data-signatory-list]').textContent.includes(signer.name),'approved name missing until reload');
          check(doc.querySelector('[data-signatory-count]').textContent==='1 signature','approved signer count stale');
        } else {
          check(!doc.querySelector('[data-signatory-list]').textContent.includes(signer.name),'held signature leaked publicly');
          check(doc.querySelector('.sign-result-note').textContent.includes('Your signature is saved.'),'held signature not acknowledged');
        }
      }
    } finally { frame.remove(); }
  });
  await test('Public signers sort by citations and supply real names and an accurate count to the subtitle', async () => {
    const frame=document.createElement('iframe'); frame.title='Fictional signer checks'; document.body.append(frame);
    try {
      const verify=async (existing, approved, expectedNames, expectedContext, failure=false) => {
        await new Promise(resolve=>{ frame.onload=resolve; frame.srcdoc='<link rel="stylesheet" href="/letter/sign.css"><p data-signatory-context>An open letter from scientists to the frontier labs</p><section data-signatories><div class="signature-meta"><span>Signatories</span><span data-signatory-count>1 signature</span></div><div data-signatory-list>Existing signature</div></section>'; });
        frame.contentWindow.fetch=async url=>{
          if(new URL(url,location.href).pathname.endsWith('signatories.json')) return Response.json(existing);
          if(failure) throw new Error('Fixture service unavailable');
          return Response.json(approved);
        };
        await new Promise((resolve,reject)=>{ const script=frame.contentDocument.createElement('script'); script.src='/letter/sign.js'; script.onload=resolve; script.onerror=reject; frame.contentDocument.body.append(script); });
        await flush();
        const doc=frame.contentDocument;
        check([...doc.querySelectorAll('.signature-name')].map(n=>n.textContent).join('|')===expectedNames.join('|'),'Incorrect signer ordering or duplicate');
        check(doc.querySelector('[data-signatory-context]').textContent===expectedContext,'Subtitle names or count incorrect');
        check(!doc.querySelector('[data-signatory-context] img'),'Signer name interpreted as HTML');
        return doc;
      };
      const maya={name:'Maya Chen',affiliation:'Example Lab',orcid:'0000-0001-5109-3700',citations:{count:1200,url:'https://openalex.org/A100'}};
      const alex={name:'Alex Morgan',affiliation:'Example Institute',orcid:'0000-0002-1825-0097',citations:{count:0,url:'https://openalex.org/A200'}};
      const unknown={name:'Unknown Researcher',affiliation:'Example College'};
      let doc=await verify([{name:maya.name,affiliation:maya.affiliation},unknown],[alex,maya],['Maya Chen','Alex Morgan','Unknown Researcher'],
        'An open letter from Maya Chen, Alex Morgan and 1 other scientist to the frontier labs');
      check(doc.querySelector('[data-signatory-count]').textContent==='3 signatures','Duplicate counted twice');
      check(doc.querySelectorAll('.signature-citations').length===2,'Unknown citation count shown as zero');
      check(doc.querySelector('.signature-citations a').textContent==='1,200 citations','Citation label too verbose');
      check(doc.querySelector('.signature-citations a').getAttribute('aria-label')==='1,200 citations · OpenAlex','Citation source absent');
      check(doc.querySelector('.signature-name a').href==='https://orcid.org/'+maya.orcid,'Name lost its research record link');
      check(!doc.querySelector('[data-signatory-list]').textContent.includes('https://'),'Raw profile URL leaked into the roll');
      const toggle=doc.querySelector('[data-signatory-toggle]'), roll=doc.querySelector('[data-signatory-list]');
      check(!toggle.hidden && toggle.getAttribute('aria-controls')===roll.id,'Overflowing names cannot be expanded');
      roll.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));
      check(roll.scrollLeft>0,'Keyboard cannot scroll the names');
      roll.dispatchEvent(new KeyboardEvent('keydown',{key:'Home',bubbles:true,cancelable:true}));
      check(roll.scrollLeft===0,'Keyboard cannot return to the first name');
      toggle.click();
      check(toggle.getAttribute('aria-expanded')==='true' && doc.querySelector('[data-signatories]').dataset.expanded==='true','Expand state missing');
      check(roll.scrollWidth<=roll.clientWidth+1,'Expanded list still scrolls horizontally');
      toggle.click(); check(toggle.getAttribute('aria-expanded')==='false','Collapse state missing');
      await verify([unknown],[maya],['Maya Chen','Unknown Researcher'],'An open letter from scientists to the frontier labs');
      await verify([unknown],[{...alex,citations:null},{...maya,citations:null}],['Unknown Researcher','Alex Morgan','Maya Chen'],
        'An open letter from 3 scientists to the frontier labs');
      await verify([unknown],[],['Unknown Researcher'],'An open letter from scientists to the frontier labs',true);
      await verify([unknown],[{...maya,name:'<img src=x>'},alex],['<img src=x>','Alex Morgan','Unknown Researcher'],
        'An open letter from <img src=x>, Alex Morgan and 1 other scientist to the frontier labs');
    } finally { frame.remove(); }
  });
  summary.textContent=passed+' passed · '+failed+' failed'; summary.className=failed?'fail':'pass';
})();
</script></html>
