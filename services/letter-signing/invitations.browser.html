<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitation browser checks</title><link rel="stylesheet" href="/letter/sign.css">
<style>body{max-width:800px;margin:40px auto;padding:0 24px;background:#fbfaf7;font:16px/1.6 Arial;color:#17271f}.pass{color:#254839}.fail{color:#9b3928}#fixture{margin-top:40px;border-top:1px solid;padding-top:24px}</style>
<h1>Invitation browser checks</h1><p>Local fixtures. Sharing and clipboard calls are stubbed; no messages leave this page.</p>
<p id="summary" role="status">Running…</p><ol id="results"></ol><section id="fixture" data-signing><div class="sign-share"></div></section>
<script src="/letter/invitations.js"></script><script>
(async () => {
  const results = document.querySelector('#results'), summary = document.querySelector('#summary'); let passed = 0, failed = 0;
  // Fixture I/O resolves in microtasks. Avoid Safari background-tab timer throttling.
  const flush = async () => { for (let i = 0; i < 40; i++) await Promise.resolve(); };
  const check = (condition, message) => { if (!condition) throw new Error(message); };
  async function test(name, run) { try { await run(); passed++; const li = document.createElement('li'); li.className='pass'; li.textContent='PASS · '+name; results.append(li); }
    catch (error) { failed++; const li=document.createElement('li'); li.className='fail'; li.textContent='FAIL · '+name+' · '+error.message;results.append(li); } }
  let events, prepared, panel, share, copy, lookup, releaseCitations;
  const candidate = { id: 'candidate-1', name: 'Maya Chen', orcid: '0000-0001-5109-3700', affiliation: 'Example Institute', citations: { count: 1250, url: 'https://openalex.org/A100' }, papers: [{ title: 'A shared paper', url: 'https://doi.org/10.1234/example' }] };
  async function mount({ unavailableShare = false, initialFailure = false, holdCitations = false, warm = false, lookupFailure = false, citationFailure = false } = {}) {
    lookup?.cancel();
    events=[]; prepared=[];
    const citationGate = holdCitations ? new Promise(resolve => { releaseCitations = resolve; }) : Promise.resolve();
    share = async data => { events.push({ type:'share', data }); };
    copy = async text => { events.push({ type:'copy', text }); };
    Object.defineProperty(navigator, 'share', { configurable: true, value: unavailableShare ? undefined : data => share(data) });
    Object.defineProperty(navigator, 'clipboard', { configurable:true, value:{ writeText:text=>copy(text) } });
    document.querySelector('#fixture').innerHTML='<div class="sign-share"></div>'; panel=document.querySelector('.sign-share');
    const network = { candidates:[candidate, {...candidate,id:'candidate-2',name:'Alex Morgan',orcid:'',citations:null}], scannedWorks:1,status:'retrieved',revision:'fixture',citationLookup:{status:'retrieved',matchedCandidates:1} };
    const request = async (path, options={}) => {
      const data=JSON.parse(options.body || '{}'); events.push({ type:'request', path, data });
      if (path==='invitations' && !options.method) { if(initialFailure) throw new Error('Test service unavailable. Try again.'); return {invitations:[],network:null}; }
      if (path==='invitations/action') return {ok:true};
      if (path==='coauthors') {
        if (lookupFailure) { lookupFailure=false; throw new Error('Fixture lookup failure'); }
        return {...network,candidates:[network.candidates[1],{...candidate,citations:null}],citationLookup:{status:'pending',matchedCandidates:0}};
      }
      if (path==='coauthors/citations') { await citationGate; if(citationFailure) throw new Error('Fixture citation failure'); return network; }
      const name=data.candidateId ? network.candidates.find(c=>c.id===data.candidateId).name : data.name || '', id=name || 'general';
      const invitation={id,name,url:'https://letter.example/?via='+encodeURIComponent(id),papers:[]};
      prepared.push(invitation);return {invitation};
    };
    lookup = window.LetterInvitations.createLookup(request);
    if (warm) { lookup.start(); await flush(); check(!events.some(e=>e.path==='invitations'),'prefetch prepared an invitation before signing'); }
    window.LetterInvitations.mount(panel,{letter:{title:'Bargaining For Our Minds'}, request, lookup});
    await flush();
  }
  await test('A general invitation is ready without contact information', async () => {
    await mount(); check(!panel.querySelector('.invite-composer').hidden,'composer missing');
    check(panel.querySelector('#invite-link').value.includes('via=general'),'referral missing');
    check(!events.some(e=>e.type==='share'||e.type==='copy'),'shared without a click');
    check(events.some(e=>e.path==='coauthors'),'lookup did not start automatically');
  });
  await test('Coauthor suggestions show their source papers', async () => {
    check(panel.querySelector('.invite-candidate-name').textContent==='Maya Chen','name missing');
    check(panel.querySelector('.invite-candidate details a').textContent==='A shared paper','evidence missing');
    check(panel.querySelector('.invite-citation-count a').textContent==='1,250 citations · OpenAlex','citation count missing');
    check(panel.querySelector('.invite-citation-count a').href==='https://openalex.org/A100','source missing');
    check(panel.querySelectorAll('.invite-citation-count')[1].textContent==='Citation count unavailable.','unknown count shown as zero');
    check(!panel.querySelector('.invite-suggestions-heading').hidden,'suggestions heading missing');
    check(panel.querySelector('.invite-candidate summary').textContent==='1 shared paper','shared count missing');
    check(panel.querySelector('.invite-discovery-note').textContent.includes('Ordered by shared papers and total citations in OpenAlex.'),'ranking description missing');
    check(panel.querySelector('.invite-discovery-note').textContent.includes('Where citation counts are unavailable, we use shared papers alone.'),'fallback description missing');
    panel.querySelector('.invite-candidate button').click(); await flush();
    check(panel.querySelector('#invite-message').value.startsWith('Hi Maya Chen,'),'personal greeting missing');
  });
  await test('Edited message reaches sharing before any bookkeeping request', async () => {
    panel.querySelector('#invite-message').value='Please take a look, Maya.'; events=[];
    panel.querySelector('.invite-native').click(); await flush();
    check(events[0].type==='share','network request preceded share and could consume user activation');
    check(events[0].data.text==='Please take a look, Maya.','edits lost');
    check(events[0].data.url.includes('Maya'),'wrong invitation link');
    check(events.some(e=>e.path==='invitations/action'&&e.data.action==='share_menu'),'handoff not recorded');
    check(!/sent|delivered/i.test(panel.querySelector('[data-invite-status]').textContent),'claimed delivery');
  });
  await test('Cancelling the share menu records no action', async () => {
    events=[]; share=async()=>{throw new DOMException('Cancelled','AbortError');};
    panel.querySelector('.invite-native').click(); await flush();
    check(!events.some(e=>e.path==='invitations/action'),'cancellation recorded as sharing');
    check(!panel.querySelector('[data-invite-status]').classList.contains('error'),'cancellation shown as error');
  });
  await test('Blocked sharing offers a copy fallback', async () => {
    share=async()=>{throw new DOMException('Blocked','NotAllowedError');};
    panel.querySelector('.invite-native').click(); await flush();
    check(panel.querySelector('[data-invite-status]').textContent.includes('Copy the invitation'),'fallback missing');
    check(!panel.querySelector('.invite-native').disabled,'share button stuck');
  });
  await test('Blocked clipboard leaves the complete invitation selectable', async () => {
    copy=async()=>{throw new DOMException('Blocked','NotAllowedError');};
    panel.querySelector('.invite-copy').click(); await flush();
    const fallback=panel.querySelector('.invite-copy-fallback');
    check(fallback.value.includes('Please take a look, Maya.'),'message missing');
    check(fallback.value.includes('https://letter.example/'),'link missing');
  });
  await test('Switching recipients preserves their edited messages', async () => {
    panel.querySelector('#invite-name').value='Alex Morgan';
    panel.querySelector('.invite-manual').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); await flush();
    check(panel.querySelector('#invite-message').value.startsWith('Hi Alex Morgan,'),'new message missing');
    [...panel.querySelectorAll('.invite-history button')].find(b=>b.textContent==='Maya Chen').click();
    check(panel.querySelector('#invite-message').value==='Please take a look, Maya.','draft overwritten');
  });
  await test('Browsers without native sharing retain copy controls', async () => {
    await mount({unavailableShare:true});check(panel.querySelector('.invite-native').hidden,'unsupported button visible');
    panel.querySelector('.invite-copy').click(); await flush();
    check(events.some(e=>e.type==='copy'&&e.text.includes('via=general')),'copy unavailable');
  });
  await test('Initial service failure can recover without re-signing', async () => {
    await mount({initialFailure:true});
    check(panel.querySelector('[data-invite-status]').textContent.includes('unavailable'),'error missing');
    [...panel.querySelectorAll('button')].find(b=>b.textContent==='Prepare a sharing link').click();await flush();
    check(!panel.querySelector('.invite-composer').hidden,'retry failed');
  });
  await test('A lookup warmed during form review is reused after signing', async () => {
    await mount({warm:true});
    check(events.filter(e=>e.path==='coauthors').length===1,'lookup repeated at signing');
    check(events.filter(e=>e.path==='coauthors/citations').length===1,'citations repeated at signing');
    check(panel.querySelector('.invite-candidate-name').textContent==='Maya Chen','warm suggestions missing');
  });
  await test('Coauthors are usable while citations load, and untouched suggestions reorder when ready', async () => {
    await mount({holdCitations:true,warm:true});
    check(panel.querySelectorAll('.invite-candidate').length===2,'coauthors blocked on citations');
    check(panel.querySelector('.invite-candidate-name').textContent==='Alex Morgan','initial order incorrect');
    check(panel.querySelector('.invite-discovery-note').textContent.includes('Loading citation counts'),'loading state missing');
    check(!panel.querySelector('.invite-candidate button').disabled,'invitation blocked on citations');
    releaseCitations(); await flush();
    check(panel.querySelector('.invite-candidate-name').textContent==='Maya Chen','citation ordering not applied');
    check(events.filter(e=>e.path==='coauthors').length===1,'mount duplicated the in-flight lookup');
  });
  await test('Late citations preserve a collaborator choice, open papers, focus and an edited message', async () => {
    await mount({holdCitations:true});
    const row=panel.querySelector('.invite-candidate');
    row.dispatchEvent(new Event('pointerdown',{bubbles:true}));
    row.querySelector('details').open=true;
    row.querySelector('button').click(); await flush();
    const message=panel.querySelector('#invite-message'); message.value='My personal note'; message.focus();
    releaseCitations(); await flush();
    check(panel.querySelector('.invite-candidate')===row,'card moved during interaction');
    check(row.querySelector('details').open,'paper list collapsed');
    check(document.activeElement===message && message.value==='My personal note','focus or draft lost');
    check(panel.querySelector('.invite-discovery-note').textContent.includes('Refresh suggestions'),'ordering update unclear');
  });
  await test('Lookup and citation failures leave invitations usable', async () => {
    await mount({lookupFailure:true});
    check(!panel.querySelector('.invite-composer').hidden,'lookup failure blocked general sharing');
    check(panel.querySelector('.invite-discover').textContent==='Try lookup again','retry missing');
    panel.querySelector('.invite-discover').click(); await flush();
    check(panel.querySelectorAll('.invite-candidate').length===2,'lookup retry did not recover');
    await mount({citationFailure:true});
    check(panel.querySelectorAll('.invite-candidate').length===2,'citation failure erased coauthors');
    check(!panel.querySelector('.invite-discover').disabled,'citation failure left lookup stuck');
  });
  await test('Cancelling a lookup stops late data from reaching another account', async () => {
    await mount({holdCitations:true});
    const note=panel.querySelector('.invite-discovery-note').textContent;
    lookup.cancel(); releaseCitations(); await flush();
    check(panel.querySelector('.invite-discovery-note').textContent===note,'cancelled result updated the old account');
  });
  await test('The real signing form starts discovery on connection and carries it through submission', async () => {
    lookup.cancel();
    const originalFetch=window.fetch, calls=[];
    let releasePapers, releaseCounts;
    const papersReady=new Promise(resolve=>{releasePapers=resolve;});
    const countsReady=new Promise(resolve=>{releaseCounts=resolve;});
    const network={candidates:[{...candidate,citations:null}],scannedWorks:1,status:'retrieved',revision:'sign-flow',citationLookup:{status:'pending',matchedCandidates:0}};
    const letter={title:'Bargaining For Our Minds',hash:'fixture-hash',paragraphs:[],url:'https://letter.example/'};
    document.body.classList.add('signing-companion');
    const root=document.querySelector('#fixture'); root.innerHTML='';
    window.fetch=async (url,options={})=>{
      const path=new URL(url,location.href).pathname.split('/api/')[1]; calls.push(path);
      if(path==='session') return Response.json({configured:true,environment:'sandbox',letter,csrf:'fixture-csrf',signature:null,
        user:{name:'Fixture Researcher',orcid:'0000-0002-1825-0097',url:'https://sandbox.orcid.org/0000-0002-1825-0097'}});
      if(path==='profile') return Response.json({status:'retrieved',name:'Fixture Researcher',suggestedAffiliation:'Example Lab',affiliations:[],keywords:[],works:[]});
      if(path==='coauthors') { await papersReady; return Response.json(network); }
      if(path==='coauthors/citations') { await countsReady; return Response.json({...network,candidates:[candidate],citationLookup:{status:'retrieved',matchedCandidates:1}}); }
      if(path==='signatures') return Response.json({signature:{name:'Fixture Researcher',affiliation:'Example Lab',status:'pending_review'}});
      if(path==='invitations'&&!options.method) return Response.json({invitations:[],network:null});
      if(path==='invitations') return Response.json({invitation:{id:'general',name:'',url:'https://letter.example/?via=general',papers:[]}});
      throw new Error('Unexpected fixture request '+path);
    };
    try {
      await new Promise((resolve,reject)=>{ const script=document.createElement('script'); script.src='/letter/sign.js'; script.onload=resolve; script.onerror=reject; document.body.append(script); });
      await flush();
      check(calls.filter(p=>p==='coauthors').length===1,'connection did not start discovery');
      check(!calls.includes('signatures')&&!calls.includes('invitations'),'connection signed or prepared an invitation');
      const form=root.querySelector('form'); check(Boolean(form),'slow lookup blocked the signing form');
      form.elements.consent.checked=true;
      form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); await flush();
      check(root.querySelector('.sign-result-note').textContent.includes('ORCID account is connected'),'signature was blocked on discovery');
      check(!root.querySelector('.invite-composer').hidden,'general invitation blocked on discovery');
      releasePapers(); await flush();
      check(Boolean(root.querySelector('.invite-candidate')),'papers blocked on citation request');
      check(root.querySelector('.invite-discovery-note').textContent.includes('Loading citation counts'),'partial state missing');
      releaseCounts(); await flush();
      check(root.querySelector('.invite-citation-count a').textContent.includes('1,250'),'late citations missing');
      check(calls.filter(p=>p==='coauthors').length===1,'signing restarted discovery');
    } finally { releasePapers(); releaseCounts(); await flush(); window.fetch=originalFetch; document.body.classList.remove('signing-companion'); }
  });
  await test('Public signers sort by citations and supply real names and an accurate count to the subtitle', async () => {
    const frame=document.createElement('iframe'); frame.title='Fictional signer checks'; document.body.append(frame);
    try {
      const verify=async (existing, approved, expectedNames, expectedContext, failure=false) => {
        await new Promise(resolve=>{ frame.onload=resolve; frame.srcdoc='<p data-signatory-context>An open letter from scientists to the frontier labs</p><section data-signatories><span data-signatory-count>1 signature</span><div data-signatory-list>Existing signature</div></section>'; });
        frame.contentWindow.fetch=async url=>{
          if(new URL(url,location.href).pathname.endsWith('signatories.json')) return Response.json(existing);
          if(failure) throw new Error('Fixture service unavailable');
          return Response.json(approved);
        };
        await new Promise((resolve,reject)=>{ const script=frame.contentDocument.createElement('script'); script.src='/letter/sign.js'; script.onload=resolve; script.onerror=reject; frame.contentDocument.body.append(script); });
        await flush();
        const doc=frame.contentDocument;
        check([...doc.querySelectorAll('.signature-name')].map(n=>n.textContent).join('|')===expectedNames.join('|'),'Incorrect signer ordering or duplicate');
        check(doc.querySelector('[data-signatory-context]').textContent===expectedContext,'Subtitle names or count incorrect');
        check(!doc.querySelector('[data-signatory-context] img'),'Signer name interpreted as HTML');
        return doc;
      };
      const maya={name:'Maya Chen',affiliation:'Example Lab',orcid:'0000-0001-5109-3700',citations:{count:1200,url:'https://openalex.org/A100'}};
      const alex={name:'Alex Morgan',affiliation:'Example Institute',orcid:'0000-0002-1825-0097',citations:{count:0,url:'https://openalex.org/A200'}};
      const unknown={name:'Unknown Researcher',affiliation:'Example College'};
      let doc=await verify([{name:maya.name,affiliation:maya.affiliation},unknown],[alex,maya],['Maya Chen','Alex Morgan','Unknown Researcher'],
        'An open letter from Maya Chen, Alex Morgan and 1 other scientist to the frontier labs');
      check(doc.querySelector('[data-signatory-count]').textContent==='3 signatures','Duplicate counted twice');
      check(doc.querySelectorAll('.signature-citations').length===2,'Unknown citation count shown as zero');
      check(doc.querySelector('.signature-citations a').textContent==='1,200 citations · OpenAlex','Citation source absent');
      await verify([unknown],[maya],['Maya Chen','Unknown Researcher'],'An open letter from scientists to the frontier labs');
      await verify([unknown],[{...alex,citations:null},{...maya,citations:null}],['Unknown Researcher','Alex Morgan','Maya Chen'],
        'An open letter from 3 scientists to the frontier labs');
      await verify([unknown],[],['Unknown Researcher'],'An open letter from scientists to the frontier labs',true);
      await verify([unknown],[{...maya,name:'<img src=x>'},alex],['<img src=x>','Alex Morgan','Unknown Researcher'],
        'An open letter from <img src=x>, Alex Morgan and 1 other scientist to the frontier labs');
    } finally { frame.remove(); }
  });
  summary.textContent=passed+' passed · '+failed+' failed'; summary.className=failed?'fail':'pass';
})();
</script></html>
